# Buildkite pipeline for MetalSprocketsExamples.
#
# Runs on a self-hosted Mac with a Metal 4 GPU, so the GPU tests that GitHub Actions skips run here.
# The agent Mac and queue are shared with MetalSprockets; agent setup is in its Documentation/Buildkite.md.

# The cluster routes jobs by queue. Every agent on this queue must be a Mac with a Metal 4 GPU.
agents:
  queue: "default-queue"

steps:
  - label: ":swift: Lint"
    key: "lint"
    command: "swiftlint --strict"

  - label: ":metal: Test (macOS, {{matrix.configuration}}, API Validation)"
    key: "test"
    # One GPU test run at a time on an agent, so parallel builds don't compete for the GPU.
    concurrency: 1
    concurrency_group: "metalsprocketsexamples/gpu-tests"
    env:
      MTL_DEBUG_LAYER: "1"
    # Optimized builds can fail where Debug passes (MetalSprockets #460).
    matrix:
      setup:
        configuration:
          - "debug"
          - "release"
    command:
      - "swift build -c {{matrix.configuration}} --package-path Packages/MetalSprocketsExamples --disable-sandbox"
      # -enable-testing: release builds disable testability by default, but the suites use @testable import.
      - "swift test -c {{matrix.configuration}} -Xswiftc -enable-testing --package-path Packages/MetalSprocketsExamples --disable-sandbox"

  - label: ":hammer: Example ({{matrix.destination}}, {{matrix.configuration}})"
    key: "example"
    # DerivedData lives in the checkout, so jobs on different agents never share (and lock) one build database.
    matrix:
      setup:
        destination:
          - "platform=macOS"
          - "generic/platform=iOS"
          - "generic/platform=xrOS"
        configuration:
          - "Debug"
          - "Release"
    command: >-
      xcodebuild build
      -project MetalSprockets-Examples.xcodeproj
      -scheme MetalSprockets-Examples
      -configuration {{matrix.configuration}}
      -destination '{{matrix.destination}}'
      -derivedDataPath .derivedData/{{matrix.configuration}}
      -skipPackagePluginValidation
      -skipMacroValidation
      CODE_SIGNING_ALLOWED=NO
