# Canonical demo index for MetalSprocketsExamples
# Source of truth: MetalSprockets-Examples/Demos.swift
#
# Fields:
#   name:             Display name (from metadata)
#   id:               Filename-safe identifier
#   description:      Short description (from metadata)
#   long_description: Long description (from metadata)
#   group:            Demo group (from metadata)
#   keywords:         Keywords (from metadata)
#   screenshot:       Screenshot filename
#   platform:         Platform restriction (null = all)
#   video:
#     duration:       How long to record (seconds)
#     interest:       low / medium / high
#     choreography:   Ordered list of actions performed during recording.
#                     Each item is a single-key mapping. Actions:
#
#       - wait: 2.0                     # idle N seconds (recording keeps rolling)
#       - click_text: "Run"             # click a button by visible text
#       - click_at: [512, 400]          # click window-relative coords (0,0 = window frame origin)
#       - drag:                         # straight drag
#           from: [512, 400]
#           to:   [800, 200]
#           duration_ms: 1500
#           easing: ease-in-out         # optional: linear|ease-in|ease-out|ease-in-out
#       - drag_path:                    # bezier drag (1 via = quadratic, 2 = cubic)
#           from: [512, 400]
#           to:   [800, 200]
#           via:  [[650, 300]]
#           duration_ms: 1500
#       - key: "space"                  # named key (optional: cmd/ctrl/alt/shift bools)
#       - key_raw: 30                   # raw keycode fallback
#
#     notes:          Freeform notes for choreography

# To find demos needing more work:  rg 'incomplete: true' demos.yaml
#
# video.order (optional, int): explicit position in the final reel.
#   Lower number = earlier. Demos without `order` appear after all ordered
#   demos, in yaml order.
# video.role (optional): free-form tag — foundation, highlight, closer, …
#   Purely informational; ordering is driven by `order`.
#
# ── Choreography templates ──────────────────────────────────────────────────
# Reusable YAML anchors. Reference with `*name`. The `_templates:` key is
# ignored by generate-video.py — it exists so anchors are parsed before the
# demos that use them.
#
# Window is 1280x720, origin = window frame. Middle ~ (640, 360).

_templates:
  # Wait, then arc-drag a downward semicircle across the middle of the
  # window to rotate the camera/scene. Good default for any 3D view with
  # drag-to-rotate controls.
  showcase-arc: &showcase_arc
    - wait: 2
    - drag_path:
        from: [565, 360]
        to:   [715, 360]
        via:  [[565, 460], [715, 460]]
        duration_ms: 2000
        easing: ease-in-out
    - wait: 1

  # Stepped scroll-zoom out (jerky; replace with smooth scroll once
  # steveo#47 lands). Cursor must already be over the 3D view.
  zoom-out-stepped: &zoom_out_stepped
    - click_at: [640, 360]               # park cursor over the view
    - scroll: { direction: down, amount: 20, repeat: 15, gap_ms: 80 }

  # Zoom out then back in. Cursor parked at window center (required
  # because scroll goes where the cursor is, not where the window is).
  # Stepped scroll workaround (steveo#47 for smooth).
  # Zoom in only. Cursor parked at window center.
  zoom-in: &zoom_in
    - wait: 0.5
    - click_at: [640, 360]
    - scroll: { direction: up, amount: 20, repeat: 8, gap_ms: 80 }
    - wait: 1

  # Zoom out only.
  zoom-out: &zoom_out
    - wait: 0.5
    - click_at: [640, 360]
    - scroll: { direction: down, amount: 20, repeat: 8, gap_ms: 80 }
    - wait: 1

  zoom-out-in: &zoom_out_in
    - wait: 1
    - click_at: [640, 360]
    - scroll: { direction: down, amount: 20, repeat: 8, gap_ms: 80 }
    - wait: 0.8
    - scroll: { direction: up, amount: 20, repeat: 8, gap_ms: 80 }
    - wait: 1

  # Arc-drag then zoom out-and-in. Good default for 3D demos where you
  # want to show both rotation and scale.
  showcase-arc-zoom: &showcase_arc_zoom
    - wait: 1
    - drag_path:
        from: [565, 360]
        to:   [715, 360]
        via:  [[565, 460], [715, 460]]
        duration_ms: 2000
        easing: ease-in-out
    - wait: 0.8
    - click_at: [640, 360]
    - scroll: { direction: down, amount: 20, repeat: 8, gap_ms: 80 }
    - wait: 0.8
    - scroll: { direction: up, amount: 20, repeat: 8, gap_ms: 80 }
    - wait: 1

  # Horizontal drag across the middle of the window. Good default for
  # panoramic / skybox / fully-rotatable scenes where an arc isn't needed.
  showcase-pan: &showcase_pan
    - wait: 1
    - drag:
        from: [400, 360]
        to:   [880, 360]
        duration_ms: 1500
        easing: ease-in-out
    - wait: 1

