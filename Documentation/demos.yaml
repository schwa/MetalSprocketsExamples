    group: Complex
    keywords: [hit-test, picking, multipass, configurable]
    screenshot: HitTest.png
    platform: null
    video:
      duration: 8
      interest: medium
      gestures: [click, rotate]
      adjustments: []
      notes: "Click on teapot to show hit data. Rotate view."

